# One-click deploy on Render. Nothing needs to be filled in: the service comes up working at its
# onrender.com address, with customer sites at /s/<name>/. Add the optional settings from
# .env.example (SITES_DOMAIN, APP_URL, ADMIN_EMAILS, RESEND_API_KEY, EMAIL_FROM) in the dashboard later.
services:
  - type: web
    name: processor-freedom-sites
    runtime: node
    plan: starter
    buildCommand: "true"
    startCommand: npm start
    healthCheckPath: /healthz
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATA_DIR
        value: /var/data
