# One-click deploy on Render: New > Blueprint > pick this repository.
services:
  - type: web
    name: processor-freedom-sites
    runtime: node
    plan: starter
    buildCommand: "true"
    startCommand: npm start
    healthCheckPath: /healthz
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 5
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATA_DIR
        value: /var/data
      - key: SITES_DOMAIN   # e.g. pfsites.com. Customer sites live at name.pfsites.com
        sync: false
      - key: APP_URL        # e.g. https://pfsites.com. Where the builder itself lives
        sync: false
      - key: ADMIN_EMAILS   # comma separated staff emails
        sync: false
      - key: RESEND_API_KEY # optional: turns on order emails
        sync: false
      - key: EMAIL_FROM     # e.g. Orders <orders@pfsites.com>
        sync: false
